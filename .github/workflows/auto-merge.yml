name: Auto-merge

# The delivery loop: a session pushes a claude/<topic> branch → CI → (green) this workflow rebases it
# onto main and pushes → CI on main → (green) Deploy Pages. Nobody needs to tap anything.
# wip/<topic> branches get CI but are never merged here. Changes to .github/workflows/ can't be pushed
# with the Actions token, so for those this opens a PR for a human to merge.
on:
  workflow_run:
    workflows: [CI] # name, not file: keep in sync with ci.yml
    types: [completed]
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: claude/ branch to merge (its latest commit must have passed CI)
        type: string
        required: true

permissions: {}

# One merge at a time; queued merges each rebase onto the main the previous one produced.
concurrency:
  group: auto-merge
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  merge:
    # Only this repository's branches (never a fork's), and only after a green push or dispatch run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    permissions:
      contents: write # push main, delete the merged branch
      actions: write # dispatch CI and Deploy Pages (the token's pushes start no workflows)
      pull-requests: write # open a PR for workflow-file changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase onto main and push
        id: merge
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/auto-merge.sh
      - name: Full CI on main
        if: ${{ steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/dispatch-and-watch.sh ci.yml main "${{ steps.merge.outputs.sha }}"
      - name: Deploy (the gate re-checks that CI passed)
        if: ${{ steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main -f deploy=true
          echo "Started Deploy Pages for the newest green commit on main." >> "$GITHUB_STEP_SUMMARY"

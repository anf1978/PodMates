name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to Pages (main only); leave disabled for a build-only check
        type: boolean
        default: false
      data_ref:
        description: Optional data branch for build-only validation (production always uses data)
        type: string
        default: data
  # GITHUB_TOKEN pushes do not emit push-triggered workflow runs.
  workflow_run:
    workflows: [Rebuild Card Database, Rebuild Commander Win-Rate Database]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Rebuilds publish data separately; source always comes from current main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble published datasets and record provenance
        env:
          DATA_REF: ${{ github.ref != 'refs/heads/main' && inputs.data_ref || 'data' }}
        run: node pipelines/lib/assemble-datasets.mjs "$DATA_REF"
      - run: npm run budget
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

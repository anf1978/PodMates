name: Update Snapshots

# Regenerates the engine golden snapshots and Playwright snapshots on Linux (Actions → Update Snapshots →
# Run workflow). Run on a ccr-, claude/ or wip/ branch, it commits to that branch; run on main, it commits to a
# new claude/snapshots-<run id> branch. Then it runs CI on that branch and, for ccr-/claude/ branches, starts
# Auto-merge, which ships the commit like any other. Only for an intended change: the change doc and the
# reason must say why the golden diff is expected (the /engine-change rule).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the snapshots change (goes into the commit message; name the change doc)
        type: string
        required: true

permissions: {}

concurrency:
  group: update-snapshots-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    permissions:
      contents: write
      actions: write # dispatch CI and Auto-merge (the token's pushes start no workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require a reason
        env:
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$(echo "$REASON" | tr -d '[:space:]')" ]; then
            echo "::error title=Update Snapshots::The reason input is required."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Update golden snapshots
        run: npm run golden:update
      - name: Update Playwright snapshots
        run: npm run e2e -- --update-snapshots --reporter=line
      - name: Commit and push to a branch
        id: commit
        env:
          REASON: ${{ inputs.reason }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            claude/* | ccr-* | wip/*) BRANCH="$REF_NAME" ;;
            *) BRANCH="claude/snapshots-$GITHUB_RUN_ID" ;;
          esac
          git add -A -- tests/golden/__snapshots__ tests/e2e
          if git diff --cached --quiet; then
            echo "No snapshot changes." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "### Snapshot changes"
            echo
            echo '```text'
            git diff --cached --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -q -m "test: update snapshots" -m "Reason: $REASON" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q origin "HEAD:refs/heads/$BRANCH"
          echo "Pushed $(git rev-parse --short HEAD) to $BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: CI on the branch, then Auto-merge
        if: ${{ steps.commit.outputs.branch != '' }}
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/dispatch-and-watch.sh ci.yml "$BRANCH" "${{ steps.commit.outputs.sha }}"
          case "$BRANCH" in
            claude/* | ccr-*) gh workflow run auto-merge.yml --ref main -f branch="$BRANCH"
                      echo "Started Auto-merge for $BRANCH." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "$BRANCH is a wip/ branch: not merged automatically." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

name: Update Snapshots

# Regenerates the engine golden snapshots and Playwright snapshots on Linux and commits them to the
# branch this run was started on (Actions → Update Snapshots → Run workflow; main by default).
# Only for an intended change: the change doc and the reason must say why the golden diff is expected
# (the /engine-change rule). The commit message carries the reason.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the snapshots change (goes into the commit message; name the change doc)
        type: string
        required: true

permissions: {}

concurrency:
  group: update-snapshots-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    permissions:
      contents: write
      actions: write # to dispatch CI on the new commit (GITHUB_TOKEN pushes start no runs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a reason
        env:
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$(echo "$REASON" | tr -d '[:space:]')" ]; then
            echo "::error title=Update Snapshots::The reason input is required."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Update golden snapshots
        run: npm run golden:update
      - name: Update Playwright snapshots
        run: npm run e2e -- --update-snapshots --reporter=line
      - name: Commit, push and start CI
        env:
          REASON: ${{ inputs.reason }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- tests/golden/__snapshots__ tests/e2e
          if git diff --cached --quiet; then
            echo "No snapshot changes." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "### Snapshot changes"
            echo
            echo '```text'
            git diff --cached --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -m "test: update snapshots" -m "Reason: $REASON" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git push origin "HEAD:$BRANCH" && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase origin "$BRANCH"
          done
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Pushed $(git rev-parse --short HEAD) to $BRANCH and started CI on it." | tee -a "$GITHUB_STEP_SUMMARY"

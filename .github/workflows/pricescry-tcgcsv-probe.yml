name: PriceScry TCGCSV Probe (run once, then send me the log)

# Looks at tcgcsv.com (a daily mirror of TCGplayer's catalogue and prices) and its history archives, and prints what is
# really there: file sizes, which dates exist, what is inside, and what a price record looks like. It changes nothing.
# I build the history importer from the real answers instead of guessing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Site status and categories
        continue-on-error: true
        run: |
          UA="PodMatesPriceScry/1.0 (+https://github.com/anf1978/PodMates)"
          echo "--- last-updated ---"; curl -sS -L -H "User-Agent: $UA" https://tcgcsv.com/last-updated.txt; echo
          echo "--- Magic groups (sets): first 700 characters ---"
          curl -sS -L -H "User-Agent: $UA" https://tcgcsv.com/tcgplayer/1/groups | head -c 700; echo

      - name: One set's prices and products
        continue-on-error: true
        run: |
          UA="PodMatesPriceScry/1.0 (+https://github.com/anf1978/PodMates)"
          GID=$(curl -sS -L -H "User-Agent: $UA" https://tcgcsv.com/tcgplayer/1/groups | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=j.results||j;const g=r.find(x=>/commander/i.test(x.name))||r[r.length-1];console.log(g.groupId);console.error('group:',g.name,g.groupId)})")
          echo "--- prices for group $GID: first 900 characters ---"
          curl -sS -L -H "User-Agent: $UA" "https://tcgcsv.com/tcgplayer/1/$GID/prices" | head -c 900; echo
          echo "--- products for group $GID: first 1400 characters ---"
          curl -sS -L -H "User-Agent: $UA" "https://tcgcsv.com/tcgplayer/1/$GID/products" | head -c 1400; echo

      - name: Which archive dates exist and how big they are
        continue-on-error: true
        run: |
          UA="PodMatesPriceScry/1.0 (+https://github.com/anf1978/PodMates)"
          for d in 2024-02-07 2024-02-08 2024-02-09 2024-06-15 2025-01-15 2025-10-15 2026-04-15 2026-10-01 2026-10-07; do
            printf "%s  " "$d"; curl -sS -I -L -H "User-Agent: $UA" "https://tcgcsv.com/archive/tcgplayer/prices-$d.ppmd.7z" | grep -i -E "^HTTP|content-length" | tr '\r\n' '  '; echo
          done

      - name: Download one archive and look inside
        continue-on-error: true
        run: |
          UA="PodMatesPriceScry/1.0 (+https://github.com/anf1978/PodMates)"
          sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1 || true
          which 7z 7za 7zz || echo "no 7z program found"
          curl -sS --fail -L -H "User-Agent: $UA" -o probe.7z https://tcgcsv.com/archive/tcgplayer/prices-2025-10-15.ppmd.7z
          ls -l probe.7z
          echo "--- top of the listing ---"; 7z l probe.7z | head -40
          echo "--- number of entries ---"; 7z l probe.7z | tail -3
          mkdir -p out && 7z x -y -bso0 -bsp0 probe.7z -oout
          echo "--- extracted tree (top) ---"; find out -maxdepth 3 | head -15
          echo "--- extracted size ---"; du -sh out
          F=$(find out -path "*/1/*" -type f | head -1); echo "--- one Magic price file: $F ---"; head -c 1100 "$F"; echo

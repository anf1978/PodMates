name: Rebuild Commander Win-Rate Database

# Runs weekly, offset from the card database rebuild rather than at the
# same time, and can also be triggered manually from the Actions tab. This
# one takes longer than the card database rebuild -- it has to make one
# request per commander ID rather than a single bulk download, respecting
# Playgroup.gg's stated rate limit -- so it's given its own schedule slot
# rather than competing with that job for runtime.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"

permissions: {}

concurrency:
  group: dataset-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the win-rate database
        run: node pipelines/winrates/build-winrate-db.mjs new-winrate-data.json

      - name: Publish validated data files
        run: node pipelines/lib/publish-datasets.mjs winrates new-winrate-data.json

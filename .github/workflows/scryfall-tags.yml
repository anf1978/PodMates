name: Scryfall Tags Build
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: scryfall-tags-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tags:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Fetch function tags
        run: node pipelines/card-db/scryfall-tags.mjs scryfall-tags.json
      - name: Summary
        run: |
          ls -la scryfall-tags.json
          node -e "const j=require('./scryfall-tags.json');for(const k in j)console.log(k,j[k].length)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scryfall-tags
          path: scryfall-tags.json

name: Rebuild Card Database

# Two ways to run this: the button under the Actions tab (workflow_dispatch),
# or automatically every Monday morning UTC. Both do exactly the same thing.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: dataset-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download current Oracle Cards
        uses: ./.github/actions/scryfall-bulk
        with:
          type: oracle_cards
          path: scryfall-bulk.jsonl

      - name: Build the compressed database
        run: node pipelines/card-db/build-card-db.mjs scryfall-bulk.jsonl new-card-db.b64

      # Function tags (blink, extra combat) feed the Key Interactions panel.
      # If Scryfall's tag search is down this step is allowed to fail: the
      # card data still refreshes and the previous tag lists are kept.
      - name: Fetch Scryfall function tags
        id: tags
        continue-on-error: true
        run: node pipelines/card-db/fetch-function-tags.mjs function-tags.json

      - name: Publish validated data files
        run: |
          if [ '${{ steps.tags.outcome }}' = success ]; then
            node pipelines/lib/publish-datasets.mjs cards new-card-db.b64 function-tags.json
          else
            node pipelines/lib/publish-datasets.mjs cards new-card-db.b64
          fi

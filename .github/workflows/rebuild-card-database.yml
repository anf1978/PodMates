name: Rebuild Card Database

# Two ways to run this: the button under the Actions tab (workflow_dispatch),
# or automatically every Monday morning UTC. Both do exactly the same thing.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

# Explicitly granted rather than relying on the repo's default token
# permissions -- GitHub increasingly defaults new repos to a read-only
# token, which makes the final git push fail immediately (exit code 128)
# before any of the real work even starts.
permissions:
  contents: write

concurrency:
  group: dataset-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scryfall's own bulk-data endpoint always points at the CURRENT file --
      # the actual download URL is timestamped and changes constantly, so this
      # has to be looked up fresh every run rather than hardcoded anywhere.
      - name: Look up the current Scryfall Oracle Cards download URL
        run: |
          curl --fail --silent --show-error https://api.scryfall.com/bulk-data/oracle-cards -o bulk-meta.json
          BULK_URL=$(jq -er '.jsonl_download_uri // .download_uri' bulk-meta.json)
          echo "Resolved download URL: $BULK_URL"
          echo "BULK_URL=$BULK_URL" >> "$GITHUB_ENV"

      - name: Download the current card data
        run: curl --fail --silent --show-error -L "$BULK_URL" -o scryfall-bulk.jsonl

      - name: Build the compressed database
        run: node .github/scripts/build-card-db.mjs scryfall-bulk.jsonl new-card-db.b64

      # Function tags (blink, extra combat) feed the Key Interactions panel.
      # If Scryfall's tag search is down this step is allowed to fail: the
      # card data still refreshes and the previous tag lists are kept.
      - name: Fetch Scryfall function tags
        id: tags
        continue-on-error: true
        run: node .github/scripts/fetch-function-tags.mjs function-tags.json

      - name: Publish validated data files
        run: |
          if [ '${{ steps.tags.outcome }}' = success ]; then
            node .github/scripts/publish-datasets.mjs cards new-card-db.b64 function-tags.json
          else
            node .github/scripts/publish-datasets.mjs cards new-card-db.b64
          fi

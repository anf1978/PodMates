name: Spellbook Snapshot Build (run on demand; download the result from the run page)

# Downloads the public Commander Spellbook data export once, boils it down to PodMates' compact
# offline snapshot, and attaches two files to the run: spellbook-snapshot.json.gz and spellbook-stats.txt.
# It changes nothing in the repo. Honest User-Agent; if the site refuses, the log says so and we stop.
# Run it again whenever you want a fresher snapshot (then send me the two files).

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: spellbook-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get this repository (for the script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download the export once
        run: |
          UA="PodMatesSpellbook/1.0 (+https://github.com/anf1978/PodMates)"
          curl --fail -sS -L -w "\nHTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" -H "User-Agent: $UA" -o variants.json https://json.commanderspellbook.com/variants.json
          ls -l variants.json

      - name: Build the snapshot and the stats
        run: node pipelines/spellbook/spellbook-snapshot.mjs variants.json out

      - name: Attach the results to this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spellbook-snapshot
          path: out/
          retention-days: 30

name: CI

# Deploy Pages listens for this workflow by name ("CI"); keep them in sync if renaming it.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Every commit on main keeps its own verdict (the deploy gate and reverts rely on it);
  # superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Explicit bash turns on pipefail, so `cmd | tee log` still fails when cmd fails.
    shell: bash

jobs:
  rules:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Firestore rules tests
        id: rules
        run: mkdir -p logs && npm run test:rules 2>&1 | tee logs/rules.log
      - name: Write summary
        if: ${{ !cancelled() }}
        run: >-
          node scripts/ci-summary.mjs "Firestore rules"
          "Rules tests (emulator)::${{ steps.rules.outcome }}::logs/rules.log"

  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm run check
        id: check
        run: mkdir -p logs && npm run check 2>&1 | tee logs/check.log
      - name: Golden diff stats
        # Shows which engine snapshots a change would rewrite; the update stays in this runner.
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        run: |
          npm run golden:update > /dev/null 2>&1 || true
          git diff --stat -- tests/golden > logs/golden.log
      - name: Build and bundle budget
        id: budget
        run: (npm run build && npm run budget) 2>&1 | tee logs/budget.log
      - run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        id: e2e
        run: npm run e2e -- --reporter=line,html 2>&1 | tee logs/e2e.log
      - name: Write summary
        if: ${{ !cancelled() }}
        run: >-
          node scripts/ci-summary.mjs "Checks"
          "Typecheck, lint, unit and golden (npm run check)::${{ steps.check.outcome }}::logs/check.log"
          "Golden snapshot diff (what --update would change)::info::logs/golden.log"
          "Build and bundle budget::${{ steps.budget.outcome }}::logs/budget.log"
          "Browser tests (Playwright)::${{ steps.e2e.outcome }}::logs/e2e.log"
      - name: Upload Playwright report
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

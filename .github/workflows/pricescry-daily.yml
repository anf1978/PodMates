name: PriceScry Daily Snapshot

# Once a day: downloads Scryfall's every-printing bulk file, adds today's prices to the
# price history, updates the yen exchange rates, adds the day's shop prices from MTGJSON, and publishes the result to the
# "pricescry-data" branch that the PriceScry tab reads.
#
# The data branch is rebuilt as a single commit each day and force-pushed ON PURPOSE:
# the price history lives inside the data files themselves, so keeping git history of a
# file that changes every day would only make the repository huge.
#
# Scryfall refreshes prices once a day, so more frequent runs would gain nothing.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricescry-daily
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the scripts (main branch)
        uses: actions/checkout@v4

      - name: Load the existing price history, if any
        run: |
          mkdir -p pricescry-data
          if git fetch origin pricescry-data --depth=1 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C pricescry-data
            echo "Loaded existing history: $(ls pricescry-data/cards 2>/dev/null | wc -l) shard files"
          else
            echo "No data branch yet -- this run starts the history."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Scryfall default_cards (every printing, with prices)
        run: |
          UA="PodMatesPriceScry/1.0 (+https://github.com/anf1978/PodMates)"
          curl -sS -L -H "User-Agent: $UA" -H "Accept: application/json" -o bulk-list.json -w "Scryfall bulk list: HTTP %{http_code}\n" https://api.scryfall.com/bulk-data
          URI=$(node -e "
            const j = JSON.parse(require('fs').readFileSync('bulk-list.json','utf8'));
            const list = Array.isArray(j.data) ? j.data : (j.download_uri ? [j] : []);
            const pick = x => x && (x.jsonl_download_uri || x.download_uri);
            const hit = list.find(x => x && x.type === 'default_cards' && pick(x)) || list.find(x => pick(x) && /default[-_]cards/i.test(pick(x)));
            console.log(hit ? pick(hit) : '');
          ")
          if [ -z "$URI" ]; then
            echo "Could not find the default_cards download address. What Scryfall returned (first 1500 characters):"
            head -c 1500 bulk-list.json; echo
            exit 1
          fi
          echo "Downloading $URI"
          curl -sS --fail -L --compressed -H "User-Agent: $UA" -H "Accept: */*" -o default-cards.jsonl.gz "$URI"
          ls -l default-cards.jsonl.gz

      - name: Add today's prices to the history
        run: node .github/scripts/pricescry-snapshot.mjs default-cards.jsonl.gz pricescry-data

      - name: Update yen exchange rates
        continue-on-error: true   # a failed rate update must not stop the price snapshot
        run: node .github/scripts/pricescry-fx.mjs pricescry-data

      - name: Refresh the MTGJSON card-id link (first run, then every Monday)
        continue-on-error: true   # MTGJSON problems must not stop the Scryfall snapshot being published
        run: |
          if [ ! -f pricescry-data/uuidmap.json.gz ] || [ "$(date -u +%u)" = "1" ]; then
            UA="PodMatesPriceScry/1.0 (+https://github.com/anf1978/PodMates)"
            curl -sS --fail -L -H "User-Agent: $UA" -o AllIdentifiers.json.gz https://mtgjson.com/api/v5/AllIdentifiers.json.gz
            ls -l AllIdentifiers.json.gz
            node .github/scripts/pricescry-mtgjson.mjs build-map AllIdentifiers.json.gz pricescry-data
          else
            echo "Card-id link is current; skipping."
          fi

      - name: Add today's MTGJSON shop prices (TCGplayer, Cardmarket, Card Kingdom, Manapool)
        continue-on-error: true
        run: |
          UA="PodMatesPriceScry/1.0 (+https://github.com/anf1978/PodMates)"
          curl -sS --fail -L -H "User-Agent: $UA" -o AllPricesToday.json.gz https://mtgjson.com/api/v5/AllPricesToday.json.gz
          ls -l AllPricesToday.json.gz
          node .github/scripts/pricescry-mtgjson.mjs prices AllPricesToday.json.gz pricescry-data

      - name: Recompute the movers from all shops
        continue-on-error: true   # if this fails the earlier Scryfall-only movers list is still published
        run: node .github/scripts/pricescry-movers.mjs pricescry-data

      - name: Publish to the pricescry-data branch
        run: |
          cd pricescry-data
          rm -rf .git
          git init -q -b pricescry-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "PriceScry data $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pricescry-data

name: PriceScry Bulk Jump Backtest (run on demand)

# Tests the bulk-buying idea: after a new card is printed, do old cards that sell for pennies (under 150 yen) reach 300 yen or more,
# and does the link engine find them better than chance? Only reads the data branch; the report appears under "Artifacts" on the run page and the
# summary is printed in the step "Run the bulk jump backtest".

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pricescry-bulkjump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - name: Check out the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load the price history
        run: |
          mkdir -p pricescry-data
          git fetch origin pricescry-data --depth=1
          git archive FETCH_HEAD | tar -x -C pricescry-data
          echo "Loaded: $(ls pricescry-data/cards 2>/dev/null | wc -l) card files"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download Scryfall default_cards (every printing, with prices)
        uses: ./.github/actions/scryfall-bulk
        with:
          type: default_cards
          path: default-cards.jsonl.gz

      - name: Run the bulk jump backtest
        run: node pipelines/pricescry/pricescry-bulkjump.mjs default-cards.jsonl.gz pricescry-data bulkjump-out

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pricescry-bulkjump
          path: |
            bulkjump-out/bulkjump-summary.txt
            bulkjump-out/bulkjump-report.json
            bulkjump-out/bulkjump-hits.csv
